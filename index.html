<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Focus To-Do App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" onerror="window.__fosLoadFailed=true"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" onerror="window.__fosLoadFailed=true"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root">
  <div id="fos-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A0C10;color:#E7E9EE;font-family:sans-serif;text-align:center;padding:24px;">
    <div>
      <div style="font-size:15px;font-weight:600;margin-bottom:8px;">Loading Focus To-Do App...</div>
      <div id="fos-fallback-sub" style="font-size:13px;color:#8B93A7;">If this message stays for more than a few seconds, please check your internet connection.</div>
    </div>
  </div>
</div>

<script>
  setTimeout(function () {
    if (window.__fosLoadFailed || typeof React === "undefined" || typeof ReactDOM === "undefined") {
      var sub = document.getElementById("fos-fallback-sub");
      if (sub) sub.innerHTML = "Could not load required files. Please check your internet connection and reload.";
    }
  }, 6000);
</script>

<script>
const { useState, useEffect, useContext, createContext, createElement: h } = React;

function useLocalStorage(key, initial) {
  const [value, setValue] = useState(() => {
    try {
      const stored = window.localStorage.getItem(key);
      return stored ? JSON.parse(stored) : initial;
    } catch (e) {
      return initial;
    }
  });
  useEffect(() => {
    try {
      window.localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {}
  }, [key, value]);
  return [value, setValue];
}

const THEMES = {
  dark: {
    bg: "#0A0C10",
    surface: "#12151C",
    surface2: "#1A1E27",
    border: "#232733",
    text: "#E7E9EE",
    textMuted: "#8B93A7",
    accent: "#6C7BFF",
    accentDim: "rgba(108,123,255,0.14)"
  },
  light: {
    bg: "#F5F6F9",
    surface: "#FFFFFF",
    surface2: "#F0F1F5",
    border: "#E3E5EC",
    text: "#14161C",
    textMuted: "#5B6172",
    accent: "#4A5AE8",
    accentDim: "rgba(74,90,232,0.10)"
  }
};

const ThemeCtx = createContext(THEMES.dark);

const NAV = [
  { id: "dashboard", label: "Dashboard" },
  { id: "daily", label: "Daily Tasks" },
  { id: "priority", label: "Priority Matrix" },
  { id: "deepwork", label: "Deep Work" },
  { id: "analytics", label: "Analytics" }
];

function App() {
  const [themeMode, setThemeMode] = useLocalStorage("focus_theme", "dark");
  const [activeTab, setActiveTab] = useState("dashboard");
  const [tasks, setTasks] = useLocalStorage("focus_tasks", []);
  const [newTask, setNewTask] = useState("");

  const theme = THEMES[themeMode];

  const addTask = () => {
    if (!newTask.trim()) return;
    setTasks([...tasks, { id: Date.now(), text: newTask, done: false }]);
    setNewTask("");
  };

  const toggleTask = (id) => {
    setTasks(tasks.map(t => t.id === id ? { ...t, done: !t.done } : t));
  };

  const deleteTask = (id) => {
    setTasks(tasks.filter(t => t.id !== id));
  };

  return h(ThemeCtx.Provider, { value: theme },
    h("div", { style: { background: theme.bg, color: theme.text, minHeight: "100vh", display: "flex", fontFamily: "Inter, sans-serif" } },
      
      /* Sidebar */
      h("div", { style: { width: 240, borderRight: `1px solid ${theme.border}`, padding: 20, display: "flex", flexDirection: "column", gap: 10 } },
        h("h2", { style: { fontFamily: "Space Grotesk", fontSize: 18, color: theme.accent, margin: "0 0 20px 0" } }, "⚡ Focus To-Do"),
        NAV.map(item => 
          h("button", {
            key: item.id,
            onClick: () => setActiveTab(item.id),
            style: {
              textAlign: "left",
              padding: "10px 14px",
              borderRadius: 8,
              background: activeTab === item.id ? theme.accentDim : "transparent",
              color: activeTab === item.id ? theme.accent : theme.textMuted,
              border: "none",
              fontWeight: 600,
              cursor: "pointer"
            }
          }, item.label)
        ),
        h("button", {
          onClick: () => setThemeMode(themeMode === "dark" ? "light" : "dark"),
          style: { marginTop: "auto", background: theme.surface2, border: `1px solid ${theme.border}`, color: theme.text, padding: 10, borderRadius: 8, cursor: "pointer" }
        }, `Toggle ${themeMode === "dark" ? "☀️ Light" : "🌙 Dark"}`)
      ),

      /* Main Content Area */
      h("div", { style: { flex: 1, padding: 30 } },
        h("h1", { style: { fontFamily: "Space Grotesk", fontSize: 24, margin: "0 0 20px 0" } },
          NAV.find(n => n.id === activeTab)?.label
        ),

        /* Quick Task Input */
        h("div", { style: { display: "flex", gap: 10, marginBottom: 20 } },
          h("input", {
            type: "text",
            value: newTask,
            onChange: (e) => setNewTask(e.target.value),
            onKeyDown: (e) => e.key === "Enter" && addTask(),
            placeholder: "Add a new task...",
            style: { flex: 1, padding: "12px 16px", borderRadius: 8, background: theme.surface, border: `1px solid ${theme.border}`, color: theme.text, outline: "none" }
          }),
          h("button", {
            onClick: addTask,
            style: { background: theme.accent, color: "#fff", border: "none", padding: "0 20px", borderRadius: 8, fontWeight: 600, cursor: "pointer" }
          }, "Add")
        ),

        /* Task List */
        h("div", { style: { display: "flex", flexDirection: "column", gap: 10 } },
          tasks.length === 0 ? 
            h("p", { style: { color: theme.textMuted, fontStyle: "italic" } }, "No tasks yet! Add one above.") :
            tasks.map(t => 
              h("div", { key: t.id, style: { display: "flex", alignItems: "center", justifyContent: "space-between", background: theme.surface, padding: "12px 16px", borderRadius: 8, border: `1px solid ${theme.border}` } },
                h("div", { style: { display: "flex", alignItems: "center", gap: 12 } },
                  h("input", { type: "checkbox", checked: t.done, onChange: () => toggleTask(t.id), style: { cursor: "pointer" } }),
                  h("span", { style: { textDecoration: t.done ? "line-through" : "none", color: t.done ? theme.textMuted : theme.text } }, t.text)
                ),
                h("button", { onClick: () => deleteTask(t.id), style: { background: "transparent", border: "none", color: "#F87171", cursor: "pointer" } }, "✕")
              )
            )
        )
      )
    )
  );
}

// Render React App
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(h(App));
</script>
</body>
</html>
